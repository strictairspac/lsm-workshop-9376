name: lsm-workshop
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-lsm-workshop}-db
    environment:
      MYSQL_DATABASE: lsm_workshop
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_lsm_demo_4106}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_lsm_root_4106}
    ports: ["${DB_PORT:-17745}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-lsm-workshop}-redis
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-lsm-workshop}-backend
    environment: &app-env
      DATABASE_URL: mysql+pymysql://app:${MYSQL_PASSWORD:-local_lsm_demo_4106}@db/lsm_workshop?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-lsm-workshop-change-before-production-20261117}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19245}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-lsm-workshop}-worker
    environment: *app-env
    command: ["python", "-u", "-m", "src.worker"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-float(pathlib.Path('/artifacts/worker.heartbeat').read_text())<20"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-lsm-workshop}-frontend
    ports: ["${FRONTEND_PORT:-18245}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
